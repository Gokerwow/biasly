<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biasly - Card Design Prototype</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Optional: Custom animation for the text sheen */
        @keyframes shine {
            0% {
                background-position: 200% center;
            }

            100% {
                background-position: -200% center;
            }
        }

        .animate-text {
            background-size: 200% auto;
            animation: shine 3s linear infinite;
        }

        /* 1. The Wrapper: Looks like the input field */
        .tag-container {
            display: flex;
            flex-wrap: wrap;
            /* IMPORTANT: Allows tags to flow to next line */
            align-items: center;
            gap: 8px;
            /* Space between tags */

            border: 1px solid #ccc;
            padding: 8px;
            border-radius: 4px;
            background: white;
            min-height: 40px;
            /* Gives it a solid feel even when empty */
            cursor: text;
            /* Clicks anywhere should focus the input */
        }

        /* 2. The Tag (The Pill) */
        .tag {
            display: flex;
            align-items: center;
            background-color: #e0e0e0;
            color: #333;
            padding: 4px 8px;
            border-radius: 16px;
            /* Makes it pill-shaped */
            font-size: 14px;
        }

        /* 3. The Actual Input */
        .tag-input {
            border: none;
            outline: none;
            /* Removes the default browser focus blue glow */
            flex-grow: 1;
            /* Takes up remaining space */
            padding: 4px;
            font-size: 14px;
            background: transparent;
            min-width: 100px;
            /* Prevents it from getting too squished */
        }
    </style>
</head>

<body
    class="flex min-h-screen items-center justify-center bg-[#050505] p-10 selection:bg-pink-500 selection:text-white">

    <div
        class="group relative aspect-[2/3] w-72 cursor-pointer overflow-hidden rounded-[1.5rem] border-2 border-white/10 bg-gray-900 shadow-xl transition-all duration-500 hover:scale-105 hover:border-pink-500/50 hover:shadow-2xl hover:shadow-pink-500/20">

        <img src="/public/assets/images/yeji-2.jpg" alt="Idol Card"
            class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-110" />

        <div class="absolute right-3 top-3 z-20">
            <div
                class="inline-flex items-center justify-center rounded-xl border border-pink-500/30 bg-black/60 px-3 py-1.5 backdrop-blur-md shadow-[0_0_15px_rgba(236,72,153,0.5)]">
                <span
                    class="animate-text px-1.5 bg-gradient-to-r from-pink-500 via-red-500 to-yellow-500 bg-clip-text text-xl font-black italic leading-none tracking-tighter text-transparent">
                    UR
                </span>
            </div>
        </div>

        <div
            class="pointer-events-none absolute inset-0 z-10 bg-gradient-to-tr from-transparent via-white/30 to-transparent opacity-0 mix-blend-overlay transition-opacity duration-700 group-hover:opacity-100">
        </div>

        <div
            class="absolute bottom-0 inset-x-0 z-20 translate-y-4 bg-gradient-to-t from-black via-black/80 to-transparent p-6 pt-24 opacity-0 transition-all duration-300 group-hover:translate-y-0 group-hover:opacity-100">

            <h2 class="mb-1 text-3xl font-black italic uppercase text-white leading-none drop-shadow-md">
                Yeji
            </h2>

            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="relative flex h-2 w-2">
                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-pink-500"></span>
                    </span>
                    <p class="text-sm font-bold text-pink-300">Checkmate Ver.</p>
                </div>
                <p class="text-[10px] font-mono text-gray-400">$450.00</p>
            </div>

        </div>

    </div>
</body>

</html>
